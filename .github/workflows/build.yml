name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build and Export IPA
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build Archive
      run: |
        xcodebuild -project iMOV.xcodeproj \
                   -scheme iMOV \
                   -sdk iphoneos \
                   -configuration Release \
                   -archivePath $PWD/build/iMOV.xcarchive \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   archive

    - name: Export IPA
      run: |
        mkdir -p build/Payload
        cp -r build/iMOV.xcarchive/Products/Applications/iMOV.app build/Payload/
        cd build && zip -r iMOV.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iMOV-IPA
        path: build/iMOV.ipa
